name: Bug
description: Signaler un comportement incorrect
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui ne fonctionne pas.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: environnement
    attributes:
      label: Environnement
      description: Version de Node, navigateur, système, image Docker...
    validations:
      required: false
