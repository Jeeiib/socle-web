# CI : qualité, tests, build et image Docker (shift-left : on casse tôt, sur la PR).
# Les noms de jobs (actionlint, qualite, tests, build, docker) sont des checks
# requis par le ruleset de `main` : ne pas les renommer, ne pas les passer en matrice.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Moindre privilège : rien par défaut, chaque job déclare ce dont il a besoin.
permissions: {}

# On annule les exécutions obsolètes sur PR, jamais sur main (chaque commit de main
# doit garder sa trace CI complète).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Binaire officiel téléchargé et vérifié par somme de contrôle : pas d'action
      # tierce de plus à faire confiance, et la version est épinglée explicitement.
      - name: Installer actionlint (checksum vérifié)
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$tarball" actionlint
      - name: Analyser les workflows
        run: ./actionlint -color

  qualite:
    name: qualite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le seuil de 80 % de lignes est bloquant (vitest.config.ts) : l'étape échoue en dessous.
      - run: pnpm test:coverage
      # Résumé lisible dans l'onglet du run, même si le seuil a échoué.
      - name: Résumé de couverture
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          {
            echo "### Couverture des tests"
            echo
            echo "| Métrique | Couvert | Total | % |"
            echo "|---|---|---|---|"
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct) |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: [qualite, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: docker
    needs: [qualite, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IMAGE: socle-web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Image chargée localement (load) : on scanne et on teste CE qui sera livré.
      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scanner l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore
      - name: Test de fumée du conteneur
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 "$IMAGE"
          status=""
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::Conteneur non sain après 60 s (état : ${status})"
            docker logs smoke
            exit 1
          fi
          curl -sSf http://localhost:3000/api/health | tee health.json
          grep -q '"status":"ok"' health.json
