# Point d'entrée de la production : TLS, redirection HTTP vers HTTPS, proxy vers l'application.
# Après modification : docker compose exec proxy nginx -t, puis nginx -s reload.

server {
    listen 80;
    server_name _;

    # Réservé au healthcheck Docker, sans redirection.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/app.crt;
    ssl_certificate_key /etc/nginx/certs/app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Métriques lues par Prometheus sur app:3000 en interne, jamais exposées au public.
    location /api/metrics {
        return 404;
    }

    # Nginx résout « app » au démarrage : deploy.sh recharge le proxy après chaque déploiement.
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
