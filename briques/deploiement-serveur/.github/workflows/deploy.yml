# Déploiement sur un serveur par SSH, après une release réussie ou à la main (rollback inclus).
# Le nom « Déploiement » est lu par la brique dast-zap : ne pas le changer sans adapter dast.yml.
name: Déploiement

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à déployer (vX.Y.Z), aussi pour un retour arrière manuel"
        required: true
        type: string

permissions: {}

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    name: deployer
    # Pour un push de tag, head_branch du workflow_run contient le nom du tag.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      GHCR_ACTOR: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Le dépôt fournit valider-tag.sh et les fichiers à copier ; aucun secret n'est encore chargé.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Valider le tag
        run: ./deploy/valider-tag.sh "$TAG"

      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Copier les fichiers de déploiement
        run: |
          set -euo pipefail
          scp -r compose.prod.yaml deploy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Se connecter à ghcr.io depuis le serveur
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029 # valeurs de variables de dépôt, développées côté client voulu
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_ACTOR' --password-stdin"

      - name: Déployer
        run: |
          # shellcheck disable=SC2029 # TAG validé plus haut, DEPLOY_DIR est une variable de dépôt
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_DIR' && ./deploy/deploy.sh '$TAG'"

      - name: Déconnecter ghcr.io
        if: always()
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true
