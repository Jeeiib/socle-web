global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Next.js : /api/metrics ; Express : remplacer par /metrics. Nginx bloque /api/metrics côté public,
  # Prometheus lit l'application directement sur le réseau Docker de la prod.
  - job_name: app
    metrics_path: /api/metrics
    static_configs:
      - targets: ["app:3000"]

  # Sonde HTTPS sur l'URL publique : disponibilité (probe_success) et expiration du certificat.
  # Remplacer exemple.fr par le domaine réel.
  - job_name: sonde-sante
    metrics_path: /probe
    params:
      module: [https_sante]
    static_configs:
      - targets: ["https://exemple.fr/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
