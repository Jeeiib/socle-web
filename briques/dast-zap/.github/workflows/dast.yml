name: DAST

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de l'environnement à scanner (staging uniquement)"
        required: true
        type: string
  workflow_run:
    workflows: [Déploiement]
    types: [completed]

permissions: {}

jobs:
  zap:
    name: zap-baseline
    # Après un déploiement : seulement s'il a réussi.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CIBLE_MANUELLE: ${{ inputs.url }}
      CIBLE_STAGING: ${{ vars.DAST_URL }}
    steps:
      - name: Choisir la cible
        id: cible
        run: |
          cible="${CIBLE_MANUELLE:-$CIBLE_STAGING}"
          if [ -z "$cible" ]; then
            echo "Aucune cible : renseigner la variable DAST_URL ou l'entrée url." >&2
            exit 1
          fi
          case "$cible" in
            https://*) ;;
            *) echo "La cible doit commencer par https://" >&2; exit 1 ;;
          esac
          echo "url=$cible" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.cible.outputs.url }}
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
